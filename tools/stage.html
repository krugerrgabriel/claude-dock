<!doctype html>
<!--
  Palco pros prints do README: papel de parede + top bar do GNOME + o dock com dados fictícios.
  Sirva a raiz do repo (python3 -m http.server) e abra:
    tools/stage.html?lang=en&view=live        (view: live | recent | sheet | summary | closed)
    tools/stage.html?lang=en&ask=running      (comando rápido: stream | running | done | focus)
    tools/stage.html?lang=pt&q=api
-->
<html>
<head>
<meta charset="utf-8">
<title>Claude Dock stage</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "Ubuntu Sans", "Ubuntu", system-ui, sans-serif;
    background:
      radial-gradient(60% 70% at 15% 85%, #ff7a59 0%, transparent 60%),
      radial-gradient(55% 60% at 85% 80%, #6b4dff 0%, transparent 62%),
      radial-gradient(70% 60% at 60% 20%, #1f6feb 0%, transparent 60%),
      radial-gradient(50% 50% at 30% 30%, #c2416a 0%, transparent 70%),
      #121228;
  }
  body::after { /* grão leve */
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .18;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.5'/></svg>");
  }
  body.no-grain::after { display: none; }
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 32px; z-index: 1;
    background: #0b0b0d; color: #f2f2f2;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px; font-size: 14px; font-weight: 600;
  }
  .topbar .ws { display: flex; gap: 6px; align-items: center; }
  .topbar .ws i { width: 8px; height: 8px; border-radius: 4px; background: #666; }
  .topbar .ws i:first-child { width: 26px; background: #fff; }
  .topbar .clock { position: absolute; left: 50%; transform: translateX(-50%); }
  .topbar .tray { display: flex; gap: 14px; opacity: .9; font-size: 13px; }
  /* janela de fundo, só pra dar contexto */
  .bgwin {
    position: fixed; left: 7%; top: 120px; width: 46%; height: 62%;
    border-radius: 12px; background: #1e1e24; box-shadow: 0 30px 80px rgba(0,0,0,.45);
    overflow: hidden; opacity: .96;
  }
  .bgwin .bar { height: 34px; background: #2a2a31; display: flex; align-items: center; gap: 8px; padding: 0 12px; }
  .bgwin .bar i { width: 11px; height: 11px; border-radius: 50%; background: #55555e; }
  .bgwin pre { margin: 0; padding: 18px 20px; color: #a9b1c6; font: 13px/1.7 "JetBrains Mono", "Ubuntu Mono", monospace; }
  .bgwin pre b { color: #ff9f5a; font-weight: 500; } .bgwin pre em { color: #7ee0b5; font-style: normal; }
  iframe {
    position: fixed; top: 32px; left: 50%; margin-left: -440px;
    width: 880px; height: 720px; border: 0; z-index: 2; background: transparent;
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="ws"><i></i><i></i><i></i></div>
    <div class="clock" id="clock"></div>
    <div class="tray"><span>⌁</span><span>🔊</span><span>⏻</span></div>
  </div>
  <div class="bgwin">
    <div class="bar"><i></i><i></i><i></i></div>
    <pre id="code"></pre>
  </div>
  <iframe id="dock" allowtransparency="true"></iframe>
<script>
  const p = new URLSearchParams(location.search);
  if (p.get("grain") === "0") document.body.classList.add("no-grain"); // GIF: sem granulado comprime muito melhor
  const lang = p.get("lang") || "en";
  const now = new Date();
  const loc = lang === "pt" ? "pt-BR" : "en-US";
  document.getElementById("clock").textContent =
    now.toLocaleDateString(loc, { month: "short", day: "numeric" }).replace(".", "") + "  " +
    now.toLocaleTimeString(loc, { hour: "2-digit", minute: "2-digit" });
  document.getElementById("code").innerHTML = lang === "pt"
    ? "<b>✻</b> Rodando os testes do checkout…\n\n  <em>✓</em> carrinho vazio\n  <em>✓</em> cupom expirado\n  <em>✓</em> frete grátis acima de R$ 200\n  … 41 de 58\n\n<b>✻</b> Corrigindo o timeout no mock do gateway"
    : "<b>✻</b> Running the checkout tests…\n\n  <em>✓</em> empty cart\n  <em>✓</em> expired coupon\n  <em>✓</em> free shipping over $50\n  … 41 of 58\n\n<b>✻</b> Fixing the timeout in the gateway mock";
  const q = new URLSearchParams({ lang });
  const view = p.get("view") || "live";
  if (view === "closed") q.set("closed", "1"); else if (view !== "live") q.set("view", view);
  if (p.get("q")) q.set("q", p.get("q"));
  if (p.get("update")) q.set("update", "1");
  if (p.get("ask")) q.set("ask", p.get("ask"));
  document.getElementById("dock").src = "../claude_dock/ui/index.html?" + q;
</script>
</body>
</html>
