<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude Sessions</title>
<link rel="stylesheet" href="library.css">
<script src="library-i18n.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-claude" viewBox="0 0 24 24"><path d="M12 2.5l1.6 6.1 5.6-3.1-3.1 5.6 6.1 1.6-6.1 1.6 3.1 5.6-5.6-3.1L12 22.5l-1.6-6.1-5.6 3.1 3.1-5.6-6.1-1.6 6.1-1.6-3.1-5.6 5.6 3.1z"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.8h5V7M6.5 7l.9 12.2a1.6 1.6 0 001.6 1.5h6a1.6 1.6 0 001.6-1.5L17.5 7M10.2 11v5.5M13.8 11v5.5"/></symbol>
      <symbol id="i-live" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M7.4 7.4a6.5 6.5 0 000 9.2M16.6 7.4a6.5 6.5 0 010 9.2M4.6 4.6a10.5 10.5 0 000 14.8M19.4 4.6a10.5 10.5 0 010 14.8"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 11-2.2-5.3M19.5 4.5v4.2h-4.2"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M14.5 5.5l4 4M4.5 19.5l1-4.2L15.8 5a1.9 1.9 0 012.7 0l.5.5a1.9 1.9 0 010 2.7L8.7 18.5z"/></symbol>
      <symbol id="i-restore" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 102.2-5.3M4.5 4.5v4.2h4.2"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5.5 12.5l4.2 4.2 8.8-9.4"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></symbol>
      <symbol id="i-sort" viewBox="0 0 24 24"><path d="M5 7h14M8 12h8M11 17h2"/></symbol>
      <symbol id="i-branch" viewBox="0 0 24 24"><circle cx="7" cy="6" r="2.2"/><circle cx="7" cy="18" r="2.2"/><circle cx="17" cy="8" r="2.2"/><path d="M7 8.2v7.6M17 10.2c0 3.8-4 4.3-9 5.6"/></symbol>
      <symbol id="i-ctx" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="2.6"/><path d="M5 6v12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6V6M5 12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M13.5 3.5H7a1.5 1.5 0 00-1.5 1.5v14A1.5 1.5 0 007 20.5h10a1.5 1.5 0 001.5-1.5V8.5zM13.5 3.5v5h5"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></symbol>
      <symbol id="i-ghostty" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 3.2a7 7 0 00-7 7v10.3l2.33-1.75 2.34 1.75L12 18.75l2.33 1.75 2.34-1.75L19 20.5V10.2a7 7 0 00-7-7zM9.6 9.2a1.35 1.35 0 110 2.7 1.35 1.35 0 010-2.7zm4.8 0a1.35 1.35 0 110 2.7 1.35 1.35 0 010-2.7z"/></symbol>
      <symbol id="i-term" viewBox="0 0 24 24"><path d="M6 8l4 4-4 4M13 16.5h5"/></symbol>
      <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2.2"/><path d="M15.5 8.5V6.2a1.7 1.7 0 00-1.7-1.7H6.2a1.7 1.7 0 00-1.7 1.7v7.6a1.7 1.7 0 001.7 1.7h2.3"/></symbol>
      <symbol id="i-hash" viewBox="0 0 24 24"><path d="M9.5 4l-2 16M16.5 4l-2 16M4.5 9h15M4 15h15"/></symbol>
    </defs>
  </svg>

  <div class="tint"></div>

  <div class="app">
    <!-- barra lateral -->
    <aside class="side">
      <header class="side-head">
        <h1 data-i18n="l_title"></h1>
        <p id="side-sub"></p>
      </header>
      <div class="side-scroll">
        <ul class="group" id="filters"></ul>
        <div class="section-title" data-i18n="l_projects"></div>
        <ul class="group" id="projects"></ul>
      </div>
      <footer class="side-foot">
        <button id="sync" class="sync"></button>
        <button id="settings-btn" class="round small" data-i18n-aria="l_settings"><svg><use href="#i-gear"/></svg></button>
      </footer>
    </aside>

    <!-- lista -->
    <main class="main">
      <header class="main-head">
        <div class="mh-text">
          <h2 id="view-title"></h2>
          <p id="view-sub"></p>
        </div>
        <div class="mh-actions">
          <div class="menu-wrap">
            <button id="sort-btn" class="pill-btn"><svg><use href="#i-sort"/></svg><span id="sort-label"></span></button>
            <ul id="sort-menu" class="menu" hidden></ul>
          </div>
          <button id="refresh" class="round" data-i18n-aria="l_refresh"><svg><use href="#i-refresh"/></svg></button>
        </div>
      </header>

      <label class="search">
        <svg><use href="#i-search"/></svg>
        <input id="q" type="text" data-i18n-ph="l_search" spellcheck="false" autocomplete="off">
        <span id="q-status" class="q-status"></span>
        <kbd class="kbd" id="q-kbd">/</kbd>
      </label>

      <div id="notice"></div>
      <div id="list" class="list"></div>
    </main>
  </div>

  <!-- barra de seleção (cápsula estilo ilha) -->
  <div id="bulk" class="bulk" hidden>
    <span id="bulk-n" class="bulk-n"></span>
    <span class="bulk-sep"></span>
    <button data-bulk="fav"><svg><use href="#i-star"/></svg><span data-i18n="l_favorite"></span></button>
    <button data-bulk="trash"><svg><use href="#i-trash"/></svg><span data-i18n="l_toTrash"></span></button>
    <button data-bulk="restore"><svg><use href="#i-restore"/></svg><span data-i18n="l_restore"></span></button>
    <button data-bulk="clear" class="bulk-x" data-i18n-aria="l_clearSel"><svg><use href="#i-x"/></svg></button>
  </div>

  <!-- aviso com desfazer -->
  <ul id="ctx" class="menu ctx" hidden></ul>
  <div id="toast" class="toast" hidden><span id="toast-text"></span><button id="toast-undo" data-i18n="l_undo"></button></div>

  <!-- folhas -->
  <div id="scrim" class="scrim"></div>
  <section id="editor" class="dialog" hidden>
    <div class="dialog-head">
      <h3 data-i18n="l_edit"></h3>
      <button class="round small" data-close data-i18n-aria="l_close"><svg><use href="#i-x"/></svg></button>
    </div>
    <p id="ed-first" class="ed-first"></p>
    <div class="field">
      <label for="ed-name" data-i18n="l_name"></label>
      <input id="ed-name" type="text" spellcheck="false" autocomplete="off">
    </div>
    <div class="field">
      <label for="ed-notes" data-i18n="l_notes"></label>
      <textarea id="ed-notes" rows="4" data-i18n-ph="l_notesPh"></textarea>
    </div>
    <div class="dialog-foot">
      <span class="hint" data-i18n="l_saveHint"></span>
      <button class="btn" data-close data-i18n="l_cancel"></button>
      <button class="btn primary" id="ed-save" data-i18n="l_save"></button>
    </div>
  </section>


<script src="library-demo.js"></script>
<script src="library.js"></script>
</body>
</html>
